<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT 图片下载设置</title>
    <link rel="stylesheet" href="settings.css">
  </head>
  <body>
    <main class="settings-card">
      <header class="header">
        <div class="brand-mark">↓</div>
        <div>
          <h1>下载目录设置</h1>
          <p>ChatGPT 图片批量下载</p>
        </div>
      </header>

      <section class="section">
        <label>当前下载目录</label>
        <div id="current-folder" class="current-folder">正在读取…</div>
        <p class="hint">Chrome 的安全机制不会把 macOS 的完整绝对路径提供给扩展；这里显示已授权目录的名称，下载会直接写入该目录。</p>
      </section>

      <section class="section">
        <button id="authorize-folder" class="primary-button" type="button" hidden>授权当前文件夹并返回</button>
        <button id="choose-folder" class="primary-button" type="button">选择其他文件夹</button>
        <div id="status" class="status" role="status"></div>
      </section>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
