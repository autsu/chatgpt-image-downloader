<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT 图片下载</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div>
          <h1>图片下载器</h1>
          <p>ChatGPT Images</p>
        </div>
        <div id="connection-dot" class="connection-dot" title="正在连接"></div>
      </header>

      <section class="scan-card">
        <div>
          <span class="eyebrow">已扫描</span>
          <strong id="scanned-count">0</strong>
          <span class="unit">张图片</span>
        </div>
        <div class="scan-meta" id="scan-meta">向下滚动页面以继续扫描</div>
      </section>

      <section class="settings-section">
        <label for="folder-input">保存路径</label>
        <div class="path-row">
          <input id="folder-input" type="text" placeholder="尚未选择文件夹" autocomplete="off" readonly>
          <button id="open-settings" class="quiet-button settings-button" type="button" title="设置下载目录" aria-label="设置下载目录">⚙</button>
        </div>
        <p id="folder-mode-hint" class="hint">请点击右侧齿轮，在插件设置页选择保存文件夹。Chrome 不提供目录的完整绝对路径。</p>
      </section>

      <section class="actions-section">
        <button id="download-all" class="primary-button" type="button">下载全部图片</button>
        <button id="download-selected" class="secondary-button" type="button">下载选中的 <span id="selected-count">0</span> 张</button>
        <button id="pause-download" class="secondary-button pause-button" type="button">暂停下载</button>
      </section>

      <section class="list-toolbar">
        <div>
          <strong>图片列表</strong>
          <span id="list-subtitle">全部选中</span>
        </div>
        <div class="toolbar-buttons">
          <button id="select-all" type="button">全选</button>
          <button id="select-none" type="button">全不选</button>
        </div>
      </section>

      <section id="image-list" class="image-list" aria-live="polite">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">✦</div>
          <strong>还没有扫描到图片</strong>
          <p>打开 chatgpt.com/images，然后向下滚动页面。</p>
        </div>
      </section>

      <div id="toast" class="toast" role="status"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
